<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Title</title>
    <link rel="stylesheet" href="linkedin.css">
</head>

<body data-color-scheme="light" data-rehydrated="True">

    <main>

        <div class="logo-div">
            <img src="image-linked/logo_2.png" alt="LinkedIn logo" width="92px" class="linkedin-logo">
        </div>

        <div class="form-div">

            <form class="linkedin-form">

                <div class="form-title">
                    <h1>Sign In</h1>
                </div>

                <div class="small-paragraph">
                    <p class="form-short-text">New to LinkedIn? <a><span>Join now</span></a></p>
                </div>

                <div class="sign-in-section">
                    <button class= "google" type="button"> <img class= "google-logo" src="image-linked/icons8-google-48.png" alt="google Sign in" > Continue with Google</button>
                    <button class= "Microsoft" type="button"><img class= "Microsoft-logo" src="image-linked/microsoft.png" alt="micorsoft sing in" width=22px >Sign in With Microsoft</button>
                    <button class= "Apple" type="button"><img class= "Apple-logo" src="image-linked/apple.png" alt="apple sign in" width=22px >Sign in with Apple</button>
                    <p>
                    By continuing, you agree to LinkedIn's
                    <a>User Agreement</a>,
                    <a>Privacy Policy</a>, and
                    <a>Cookie Policy</a>
                </p>
                </div>

                <div class="divider">
                    <p>or</p>
                </div>

                <div class="Account-details">
                    <label for="email-or-phone">Email or Phone Number</label>
                        <input class="Email-number-section" id="email-or-phone" type="text">
                    <br>

                    <label for="Password">Password</label>
                    <input class="Password"type="password" id="Password">

                    <div class="check-up-questions">
                    <a class="forgot-password">forgot Password?</a>
                    <p>
                        <input class= "keep-signed"type="checkbox">
                        Keep me signed In
                    </p>
                     </div>
                    
                    <button class="sign-in-button" type="submit">Sign In</button>
                   
                </div>

            </form>
            <div class="webpage-end-text">
            <p>
                LinkedIn corporation ©
                <a>User Agreement</a>
                <a>Community Guidelines</a>
                <a>Cookie Policy</a>
                <a>Copyright Policy</a>
                <a>Send Feedback</a>
            </p>
            </div>
        </div>

    </main>

</body>
</html>
